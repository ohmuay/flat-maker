<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat Pattern Maker</title>

</head>
<body>


    <header class="top">
      <h1>Flat Pattern Maker</h1>
      <span id="shape-name" class="shape-name"></span>
    </header>
    <main class="layout">
      <aside class="panel">
        <div id="shapes" class="shape-grid" role="group" aria-label="Shape"></div>
        <form id="params" onsubmit="return false"></form>
        <p id="error" class="error" hidden></p>
        <div id="info" class="info"></div>
        <button id="defaults" class="link" type="button">Reset to defaults</button>
      </aside>
      <section class="views">
        <div class="view">
          <div class="view-bar">
            <span>3D formed part</span>
            <span class="bar-tools">
              <button id="fold-play" type="button" aria-label="Play folding animation">▶ Fold</button>
              <input id="fold" type="range" min="0" max="100" value="100" aria-label="Fold amount" />
              <button id="reset3d" type="button">Reset view</button>
            </span>
          </div>
          <div id="view3d" class="canvas"></div>
        </div>
        <div class="view">
          <div class="view-bar">
            <span>Flat pattern (mm), seen from outside · red = bend lines</span>
            <span class="bar-tools">
              <button id="fit2d" type="button">Fit</button>
              <button id="download" class="primary" type="button">Download DXF</button>
            </span>
          </div>
          <div id="view2d" class="canvas"></div>
        </div>
      </section>
    </main>
